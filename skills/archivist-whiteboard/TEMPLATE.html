<script>

    themeVariables: { fontSize: '12px', primaryColor: '#e7e3d7', primaryBorderColor: '#b9b1a0',

<script>
/* ===== DATA — the documents, their references, their degrees ===== */
/* the marker below becomes one object per document: p path, t title, r refs, x body */

const G = __GRAPH__;

const byPath = new Map();

const nodes = G.map(function (d, i) {
  const seg = d.p.split('/');
  const n = { i: i, p: d.p, t: d.t, body: d.x, layer: seg.length > 1 ? seg[0] : 'other',
              name: seg[seg.length - 1].replace(/\.md$/, ''), indeg: 0, outdeg: d.r.length };
  byPath.set(d.p, n); return n;
});

const edges = [];

G.forEach(function (d, i) {
  d.r.forEach(function (r) {
    const t = byPath.get(r);
    if (t) { edges.push({ s: nodes[i], t: t }); t.indeg++; }
  });
});

const maxIn = nodes.reduce(function (m, n) { return Math.max(m, n.indeg); }, 1);

function radius(n) { return 2.4 + 6 * Math.sqrt(n.indeg / maxIn); }

/* ===== PINS — the one table of colour and shape ===== */
/* this table is the only place colour and shape are stated */

/* the board, the paper, the reference dot and the legend all read it */

const PIN = {
  L1_features:   { c: '#c98500', d: false, n: 'L1 features' },
  L2_specs:      { c: '#3987e5', d: false, n: 'L2 specs' },
  L2_designs:    { c: '#3987e5', d: true,  n: 'L2 designs' },
  L3_structures: { c: '#d55181', d: true,  n: 'L3 structures' },
  L3_terms:      { c: '#d55181', d: false, n: 'L3 terms' },
  L4_articles:   { c: '#008300', d: false, n: 'L4 articles' }
};

const FALLBACK = { c: '#98a0b2', d: false, n: 'other' };

function pinOf(layer) { return PIN[layer] || FALLBACK; }

function pinCSS(layer, px) {
  const m = pinOf(layer);
  return 'background:' + m.c + ';width:' + px + 'px;height:' + px + 'px;'
       + (m.d ? 'border-radius:1px;transform:rotate(45deg)' : 'border-radius:50%');
}

const layers = [];

nodes.forEach(function (n) { if (layers.indexOf(n.layer) < 0) layers.push(n.layer); });

layers.sort();

document.getElementById('legend').innerHTML = layers.map(function (l) {
  const c = nodes.filter(function (n) { return n.layer === l; }).length;
  return '<span><i style="' + pinCSS(l, 8) + '"></i>' + pinOf(l).n + ' (' + c + ')</span>';
}).join('');

/* ===== LAYERS — which ring a layer sits on ===== */
function rankOf(n) {
  const m = n.layer.match(/^L(\d)/);
  return m ? +m[1] : 9;
}

const RANKS = (function () {
  const r = [];
  nodes.forEach(function (n) { if (r.indexOf(rankOf(n)) < 0) r.push(rankOf(n)); });
  return r.sort(function (a, b) { return a - b; });
})();

function ringR(rk) {
  const i = RANKS.indexOf(rk);
  return .12 + (RANKS.length < 2 ? 0 : i * (.34 / (RANKS.length - 1)));
}

/* the ring view is the layer view, so the rings carry the layer names */

const RANKNAME = (function () {
  const m = {};
  nodes.forEach(function (n) {
    const r = rankOf(n), nm = pinOf(n.layer).n;
    if (!m[r]) m[r] = [];
    if (m[r].indexOf(nm) < 0) m[r].push(nm);
  });
  const out = {};
  Object.keys(m).forEach(function (r) { out[r] = m[r].join(' / '); });
  return out;
})();

/* ===== GROUPS — which documents belong together ===== */
let GROUPS = null;

/* computed once; the two layouts that need groups read the same result */

function communities() {
  if (GROUPS) return GROUPS;
  const near = nodes.map(function () { return new Set(); });
  edges.forEach(function (e) { near[e.s.i].add(e.t.i); near[e.t.i].add(e.s.i); });
  const deg = near.map(function (x) { return x.size; });
  const m2 = (edges.length * 2) || 1;
  const lab = nodes.map(function (n, i) { return i; });
  const tot = deg.slice();
  for (let pass = 0; pass < 20; pass++) {
    let moved = 0;
    for (let i = 0; i < nodes.length; i++) {
      const cur = lab[i];
      tot[cur] -= deg[i];
      const k = new Map();
      near[i].forEach(function (j) { k.set(lab[j], (k.get(lab[j]) || 0) + 1); });
      let best = cur, gain = (k.get(cur) || 0) - tot[cur] * deg[i] / m2;
      k.forEach(function (kin, c) {
        const g = kin - tot[c] * deg[i] / m2;
        if (g > gain + 1e-12) { best = c; gain = g; }
      });
      lab[i] = best; tot[best] += deg[i];
      if (best !== cur) moved++;
    }
    if (!moved) break;
  }
  const group = new Map();
  nodes.forEach(function (n, i) {
    if (!group.has(lab[i])) group.set(lab[i], []);
    group.get(lab[i]).push(i);
  });
  GROUPS = Array.from(group.values()).sort(function (a, b) { return b.length - a.length; });
  return GROUPS;
}

/* ===== LAYOUTS — one function per slot, each returning 0..1 coordinates ===== */
/* radius is the rank by how often a document is referenced, angle is its group */

function gravityLayout() {
  const c = nodes.map(function () { return { x: .5, y: .5 }; });
  const order = [];
  communities().forEach(function (g) {
    g.slice().sort(function (a, b) { return nodes[a].p < nodes[b].p ? -1 : 1; })
     .forEach(function (i) { order.push(i); });
  });
  const rank = nodes.map(function (n, i) { return i; })
    .sort(function (a, b) {
      return nodes[b].indeg - nodes[a].indeg || (nodes[a].p < nodes[b].p ? -1 : 1);
    });
  const depth = nodes.map(function () { return 0; });
  rank.forEach(function (i, k) { depth[i] = k; });
  const last = Math.max(1, nodes.length - 1);
  order.forEach(function (i, k) {
    const a = k / order.length * Math.PI * 2 - Math.PI / 2;
    const r = .05 + .40 * (depth[i] / last);
    c[i].x = .5 + Math.cos(a) * r;
    c[i].y = .5 + Math.sin(a) * r * 1.5;
  });
  return c;
}

const LAYOUT = [
  { id: 'gravity', label: '引力図',
    icon: '<circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/><circle cx="4" cy="6" r="1.5"/><circle cx="20" cy="7" r="1.5"/><circle cx="5" cy="19" r="1.5"/><circle cx="19" cy="18" r="1.5"/><path d="M5.6 7.4 9.8 10.6M18.4 8.3 14.2 10.8M6.4 17.6 10 13.8M17.6 16.8 14 13.6"/>',
    fn: gravityLayout },
  { id: 'cluster', label: '群れ',
    icon: '<circle cx="6.5" cy="7" r="1.6"/><circle cx="9.5" cy="10.5" r="1.6"/><circle cx="5.5" cy="11.5" r="1.6"/><circle cx="17" cy="16" r="1.6"/><circle cx="19" cy="12.5" r="1.6"/><circle cx="15" cy="12.5" r="1.6"/><path d="M11.5 9.5 14 11.5" stroke-dasharray="2 2"/>',
    fn: function () {
      const cl = communities();
      const total = nodes.length || 1;
      const cp = [];
      let acc = 0;
      cl.forEach(function (g) {
        const mid = (acc + g.length / 2) / total;
        const a = mid * Math.PI * 2 - Math.PI / 2;
        const far = .06 + .16 * (1 - g.length / cl[0].length);
        cp.push({ x: .5 + Math.cos(a) * far, y: .5 + Math.sin(a) * far * 1.5 });
        acc += g.length;
      });
      const big = cl[0].length;
      const c = nodes.map(function () { return { x: .5, y: .5 }; });
      cl.forEach(function (g, ci) {
        const R = .030 + .085 * Math.sqrt(g.length / big);
        const rings = new Map();
        g.forEach(function (i) {
          const r = rankOf(nodes[i]);
          if (!rings.has(r)) rings.set(r, []);
          rings.get(r).push(i);
        });
        const keys = Array.from(rings.keys()).sort(function (a, b) { return a - b; });
        keys.forEach(function (rk, ri) {
          const ring = rings.get(rk).sort(function (a, b) { return nodes[b].indeg - nodes[a].indeg; });
          const rr = keys.length < 2 ? 0 : R * (.25 + .75 * ri / (keys.length - 1));
          ring.forEach(function (i, k) {
            const a = k / ring.length * Math.PI * 2 - Math.PI / 2;
            c[i].x = cp[ci].x + Math.cos(a) * rr;
            c[i].y = cp[ci].y + Math.sin(a) * rr * 1.5;
          });
        });
      });
      return c;
    } },
  { id: 'radial', label: '同心',
    icon: '<circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="9.6"/>',
    fn: function () {
      const c = nodes.map(function () { return { x: .5, y: .5 }; });
      const cl = communities();
      const total = nodes.length || 1;
      const from = [], span = [];
      let acc = 0;
      cl.forEach(function (g) {
        from.push(acc / total * Math.PI * 2);
        span.push(g.length / total * Math.PI * 2);
        acc += g.length;
      });
      /* angle is the group and radius is the layer, so a group reads as one spoke */
      RANKS.forEach(function (rk) {
        const r = ringR(rk);
        cl.forEach(function (g, ci) {
          const list = g.filter(function (i) { return rankOf(nodes[i]) === rk; })
                        .sort(function (a, b) { return nodes[a].p < nodes[b].p ? -1 : 1; });
          list.forEach(function (i, k) {
            const t = list.length === 1 ? .5 : (k + .5) / list.length;
            const a = from[ci] + span[ci] * t - Math.PI / 2;
            c[i].x = .5 + Math.cos(a) * r * .95;
            c[i].y = .5 + Math.sin(a) * r * 1.55;
          });
        });
      });
      return c;
    } }
];

const SLOT = {};

LAYOUT.forEach(function (l) { SLOT[l.id] = l.fn(); });

/* ===== VIEW — where the board is looked at from ===== */
const stage = document.getElementById('stage');

const cv = document.getElementById('board'), ctx = cv.getContext('2d');

const lbl = document.getElementById('lbl');

const zoomhud = document.getElementById('zoomhud'), camBtn = document.getElementById('keepcam');

const zoomSlider = document.getElementById('zoomslider');

/* the board opens wider than the screen */

const SPREAD = 2;

let W = 0, H = 0;

const dpr = Math.min(devicePixelRatio || 1, 2);

let cur = SLOT[LAYOUT[0].id].map(function (p) { return { x: p.x, y: p.y }; });

let from = cur.map(function (p) { return { x: p.x, y: p.y }; });

let to = cur.map(function (p) { return { x: p.x, y: p.y }; });

let mt = 1, mode = LAYOUT[0].id, hot = null, focusNode = null;

/* none of this state leaves the page */

let k = 1, tx = 0, ty = 0, drag = null, camOn = false, camTarget = null, ztop = 10;

const pos = nodes.map(function () { return { x: 0, y: 0 }; });

const papers = [];

function resize() {
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function wx(ux) { return (.5 + (ux - .5) * SPREAD) * W; }

function wy(uy) { return (.5 + (uy - .5) * SPREAD) * H; }

function sx(ux) { return (wx(ux) - W / 2) * k + W / 2 + tx; }

function sy(uy) { return (wy(uy) - H / 2) * k + H / 2 + ty; }

function zoomAbout(nk, px, py) {
  nk = Math.max(.3, Math.min(6, nk));
  tx = (px - W / 2) - ((px - W / 2) - tx) * (nk / k);
  ty = (py - H / 2) - ((py - H / 2) - ty) * (nk / k);
  k = nk; zoomSlider.value = k;
}

function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

/* the switch interpolates per point, so the same point moves */

/* the board stays interactive while it moves */

function setLayout(id) {
  mode = id;
  from = cur.map(function (p) { return { x: p.x, y: p.y }; });
  to = SLOT[id].map(function (p) { return { x: p.x, y: p.y }; });
  mt = 0;
  document.querySelectorAll('[data-layout]').forEach(function (b) {
    b.classList.toggle('on', b.dataset.layout === id);
  });
}

/* ===== TOOLS — the toolbar ===== */
document.getElementById('layouts').innerHTML = LAYOUT.map(function (l, i) {
  return '<button data-layout="' + l.id + '" class="' + (i ? '' : 'on') + '" title="' + l.label + '">'
       + '<svg viewBox="0 0 24 24">' + l.icon + '</svg></button>';
}).join('');

document.querySelectorAll('[data-layout]').forEach(function (b) {
  b.addEventListener('click', function () { setLayout(b.dataset.layout); });
});

camBtn.addEventListener('click', function () { camOn = !camOn; camBtn.classList.toggle('on', camOn); });

document.getElementById('reset').addEventListener('click', function () {
  k = 1; tx = ty = 0; zoomSlider.value = 1; camTarget = null;
});

document.getElementById('clear').addEventListener('click', function () {
  papers.slice().forEach(closePaper); focusNode = null;
});

zoomSlider.addEventListener('input', function () { zoomAbout(+zoomSlider.value, W / 2, H / 2); });

/* ===== DOCUMENT — the body of a document, drawn by the libraries ===== */
function resolve(ctx, href) {
  if (/^[a-z]+:/i.test(href)) return null;
  const base = ctx.split('/').slice(0, -1);
  href.split('#')[0].split('/').forEach(function (p) {
    if (p === '..') base.pop(); else if (p !== '.' && p !== '') base.push(p);
  });
  return base.join('/');
}

const DIAGRAM = [];

let diagramSeq = 0;

/* no library, no markdown: the body is shown as it was written */

function renderDoc(el, n) {
  if (typeof marked === 'undefined') { el.textContent = n.body; return; }
  /* marked leaves the HTML comments in the documents as comments, so they do not show as text */
  el.innerHTML = marked.parse(n.body);
  el.querySelectorAll('a[href]').forEach(function (a) {
    const p = resolve(n.p, a.getAttribute('href'));
    const t = p && byPath.get(p);
    /* a link landing outside the document set loses its anchor and stays as text */
    if (!t) { a.replaceWith(document.createTextNode(a.textContent)); return; }
    a.removeAttribute('href');
    a.className = 'ref';
    a.dataset.go = p;
    const dot = document.createElement('i');
    dot.setAttribute('style', pinCSS(t.layer, 7));
    a.prepend(dot);
  });
  el.querySelectorAll('pre > code.language-mermaid').forEach(function (c) {
    const box = document.createElement('div');
    if (typeof mermaid === 'undefined') { box.className = 'mmd none'; box.textContent = '図は描けない'; }
    else { box.className = 'mmd'; box.dataset.idx = DIAGRAM.push(c.textContent) - 1; }
    c.parentNode.replaceWith(box);
  });
  drawDiagrams(el);
}

/* no library, no diagram: we never draw one ourselves */

function drawDiagrams(root) {
  if (typeof mermaid === 'undefined') return;
  root.querySelectorAll('.mmd[data-idx]').forEach(function (el) {
    const code = DIAGRAM[+el.dataset.idx];
    el.removeAttribute('data-idx');
    mermaid.render('d' + (diagramSeq++), code)
      .then(function (r) { el.innerHTML = r.svg; })
      .catch(function () { el.className = 'mmd none'; el.textContent = '図は描けない'; });
  });
}

/* ===== PAPERS — an opened document on the board ===== */
function paperFor(n) {
  const el = document.createElement('div');
  el.className = 'paper';
  el.innerHTML = '<span class="pin" style="' + pinCSS(n.layer, 11) + '"></span>'
    + '<div class="hd"><div class="kp">' + n.p + '</div><h5>' + n.t + '</h5></div>'
    + '<div class="bd"><div class="md"></div></div><div class="grip"></div>';
  stage.appendChild(el);
  renderDoc(el.querySelector('.md'), n);
  /* a paper holds board coordinates, so it pans and zooms with the board */
  const m = { n: n, ux: cur[n.i].x + .02, uy: cur[n.i].y + .015, w: 330, h: 280, z: ++ztop, el: el };
  papers.push(m);
  el.style.zIndex = m.z;
  el.querySelector('.pin').addEventListener('click', function (ev) { ev.stopPropagation(); closePaper(m); });
  el.querySelector('.hd').addEventListener('mousedown', function (ev) {
    drag = { paper: m, mode: 'move', mx: ev.clientX, my: ev.clientY };
    el.classList.add('dragging'); ev.preventDefault();
  });
  el.querySelector('.grip').addEventListener('mousedown', function (ev) {
    drag = { paper: m, mode: 'size', mx: ev.clientX, my: ev.clientY };
    el.classList.add('dragging'); ev.preventDefault();
  });
  /* raise by z-index, never by re-appending: moving the node between mousedown and mouseup swallows the click */
  el.addEventListener('mousedown', function () { m.z = ++ztop; el.style.zIndex = m.z; });
  return m;
}

function closePaper(m) {
  m.el.remove();
  papers.splice(papers.indexOf(m), 1);
  if (focusNode === m.n) focusNode = papers.length ? papers[papers.length - 1].n : null;
}

function paperOf(n) { return papers.filter(function (m) { return m.n === n; })[0]; }

function bringIntoView(n) {
  const x = sx(cur[n.i].x), y = sy(cur[n.i].y), pad = 100;
  if (x > pad && x < W - pad && y > pad && y < H - pad) return;
  camTarget = n;
}

function toggle(n) {
  const had = paperOf(n);
  if (had) { closePaper(had); return; }
  focusNode = n; bringIntoView(n); paperFor(n);
}

stage.addEventListener('click', function (ev) {
  const a = ev.target.closest('[data-go]');
  if (!a) return;
  const n = byPath.get(a.dataset.go);
  if (!n) return;
  focusNode = n;
  const had = paperOf(n);
  if (had) { had.z = ++ztop; had.el.style.zIndex = had.z; bringIntoView(n); }
  else { bringIntoView(n); paperFor(n); }
});

stage.addEventListener('mouseover', function (ev) {
  const a = ev.target.closest('[data-go]');
  if (a) { const n = byPath.get(a.dataset.go); if (n) hot = n; }
});

stage.addEventListener('mouseout', function (ev) {
  if (ev.target.closest('[data-go]')) hot = null;
});

/* ===== TREE — the sidebar rooted at the open paper ===== */
const side = document.getElementById('side');

const expanded = new Set();

let treeOf = null;

function refsOut(n) {
  return G[n.i].r.map(function (p) { return byPath.get(p); }).filter(Boolean);
}

function refsIn(n) {
  return edges.filter(function (e) { return e.t === n; }).map(function (e) { return e.s; });
}

/* a row carries the data-go a reference in the text carries, so one handler opens both */

function rowHTML(n, depth, cls, key, openable, count) {
  const tw = openable ? (expanded.has(key) ? '\u25be' : '\u25b8') : '';
  return '<div class="row ' + cls + '" data-go="' + n.p + '" style="padding-left:' + (depth * 11) + 'px">'
       + '<span class="tw"' + (openable ? ' data-key="' + key + '"' : '') + '>' + tw + '</span>'
       + '<span class="pb"><i style="' + pinCSS(n.layer, cls.indexOf('head') >= 0 ? 11 : 7) + '"></i></span>'
       + '<span class="n">' + n.name + '</span>'
       + (count ? '<span class="c">' + count + '</span>' : '')
       + '</div>';
}

/* a reference already seen on the branch is not walked again, which is what keeps a cycle from recursing */

/* the branch stops at six levels */

function walkOut(n, depth, key, seen, html) {
  refsOut(n).forEach(function (t) {
    const k = key + '>' + t.p;
    const dup = seen.has(t.p);
    const kids = refsOut(t).length;
    html.push(rowHTML(t, depth, 'out' + (dup ? ' dup' : ''), k, kids > 0 && !dup, kids || ''));
    if (kids && !dup && expanded.has(k) && depth < 6) {
      const next = new Set(seen); next.add(t.p);
      walkOut(t, depth + 1, k, next, html);
    }
  });
}

/* the tree reads downward: what the focus points at, the focus, what points at it */

/* the section mark is a node with an arrow leaving or entering it, in the colour its edges carry */

function sectionHTML(dir, count) {
  const arrow = dir === 'out'
    ? '<circle cx="3" cy="4.5" r="2.6" fill="currentColor"/>'
      + '<path d="M7 4.5h9" stroke="currentColor" fill="none"/><path d="M13 1.8 16.2 4.5 13 7.2" stroke="currentColor" fill="none"/>'
    : '<circle cx="16" cy="4.5" r="2.6" fill="currentColor"/>'
      + '<path d="M3 4.5h9" stroke="currentColor" fill="none"/><path d="M9 1.8 12.2 4.5 9 7.2" stroke="currentColor" fill="none"/>';
  return '<div class="sec ' + dir + '"><svg viewBox="0 0 19 9" stroke-width="1.3" stroke-linecap="round" '
       + 'stroke-linejoin="round">' + arrow + '</svg>' + count + '</div>';
}

function renderTree() {
  if (!treeOf) { side.hidden = true; return; }
  side.hidden = false;
  const out = refsOut(treeOf), into = refsIn(treeOf);
  const html = [];
  html.push(sectionHTML('out', out.length));
  if (out.length) walkOut(treeOf, 0, treeOf.p, new Set([treeOf.p]), html);
  else html.push('<div class="row empty"><span class="tw"></span><span class="n">なし</span></div>');
  html.push(rowHTML(treeOf, 0, 'head', treeOf.p, false, ''));
  html.push(sectionHTML('into', into.length));
  if (into.length) into.forEach(function (t) {
    html.push(rowHTML(t, 0, 'into', treeOf.p + '<' + t.p, false, refsIn(t).length || ''));
  });
  else html.push('<div class="row empty"><span class="tw"></span><span class="n">なし</span></div>');
  side.innerHTML = html.join('');
}

side.addEventListener('click', function (ev) {
  const tw = ev.target.closest('[data-key]');
  if (tw) {
    ev.stopPropagation();
    const k = tw.dataset.key;
    if (expanded.has(k)) expanded.delete(k); else expanded.add(k);
    renderTree();
    return;
  }
  /* selecting a row re-roots the tree on it */
  const row = ev.target.closest('[data-go]');
  if (!row) return;
  ev.stopPropagation();
  const n = byPath.get(row.dataset.go);
  if (!n || n === treeOf) return;
  focusNode = n;
  bringIntoView(n);
  const had = paperOf(n);
  if (had) { had.z = ++ztop; had.el.style.zIndex = had.z; } else paperFor(n);
}, true);

/* ===== SEARCH — a word to a document ===== */
const find = document.getElementById('find');

const q = document.getElementById('q'), hits = document.getElementById('hits');

let fuse = null, hitList = [], sel = -1;

/* no library, no search: the box is not shown at all */

if (typeof Fuse !== 'undefined') {
  fuse = new Fuse(nodes, {
    keys: [{ name: 't', weight: 3 }, { name: 'name', weight: 3 }, { name: 'p', weight: 2 },
           { name: 'body', weight: 1 }],
    /* ignoreLocation and a one-character minimum are what carry Japanese, which has no word breaks */
    includeMatches: true, ignoreLocation: true, threshold: .3, minMatchCharLength: 1, limit: 24
  });
  find.hidden = false;
}

function snippet(r) {
  const m = (r.matches || []).filter(function (x) { return x.key === 'body'; })[0];
  if (!m || !m.indices.length) return r.item.t;
  const at = m.indices.sort(function (a, b) { return (b[1] - b[0]) - (a[1] - a[0]); })[0];
  const body = r.item.body;
  const from = Math.max(0, at[0] - 34), to = Math.min(body.length, at[1] + 46);
  const cut = function (t) { return t.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
  return (from ? '…' : '') + cut(body.slice(from, at[0])) + '<mark>' + cut(body.slice(at[0], at[1] + 1))
       + '</mark>' + cut(body.slice(at[1] + 1, to)).replace(/\n+/g, ' ') + (to < body.length ? '…' : '');
}

function runSearch() {
  const term = q.value.trim();
  sel = -1;
  if (!fuse || term.length < 1) { hitList = []; hits.innerHTML = ''; return; }
  hitList = fuse.search(term).slice(0, 24);
  if (!hitList.length) { hits.innerHTML = '<div class="none">該当なし</div>'; return; }
  hits.innerHTML = hitList.map(function (r, i) {
    const n = r.item;
    return '<div class="hit" data-i="' + i + '"><div class="t"><span class="pb"><i style="'
         + pinCSS(n.layer, 7) + '"></i></span><span class="nm">' + n.name + '</span></div>'
         + '<div class="s">' + snippet(r).replace(/\n+/g, ' ') + '</div></div>';
  }).join('');
}

/* a hit opens the paper and re-roots the tree, the way a row in the tree does */

function openHit(i) {
  const r = hitList[i];
  if (!r) return;
  const n = r.item;
  focusNode = n;
  bringIntoView(n);
  const had = paperOf(n);
  if (had) { had.z = ++ztop; had.el.style.zIndex = had.z; } else paperFor(n);
}

q.addEventListener('input', runSearch);

q.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') { q.value = ''; runSearch(); q.blur(); return; }
  if (ev.key === 'Enter') { openHit(sel < 0 ? 0 : sel); return; }
  if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
  ev.preventDefault();
  sel = Math.max(0, Math.min(hitList.length - 1, sel + (ev.key === 'ArrowDown' ? 1 : -1)));
  hits.querySelectorAll('.hit').forEach(function (el, i) { el.classList.toggle('sel', i === sel); });
  const cur = hits.querySelector('.hit.sel');
  if (cur) cur.scrollIntoView({ block: 'nearest' });
});

hits.addEventListener('click', function (ev) {
  const el = ev.target.closest('[data-i]');
  if (el) openHit(+el.dataset.i);
});

addEventListener('keydown', function (ev) {
  if (ev.key === '/' && document.activeElement !== q) { ev.preventDefault(); q.focus(); }
});

/* ===== DRAW — one frame of the board ===== */
function frame(now) {
  const el = now / 1000;
  if (focusNode !== treeOf) { treeOf = focusNode; renderTree(); }
  if (mt < 1) mt = Math.min(1, mt + .022);
  const e = ease(mt);
  for (let i = 0; i < cur.length; i++) {
    cur[i].x = from[i].x + (to[i].x - from[i].x) * e;
    cur[i].y = from[i].y + (to[i].y - from[i].y) * e;
  }
  const follow = camOn ? focusNode : camTarget;
  if (follow) {
    const fx = -(wx(cur[follow.i].x) - W / 2) * k, fy = -(wy(cur[follow.i].y) - H / 2) * k;
    tx += (fx - tx) * .09; ty += (fy - ty) * .09;
    if (!camOn && Math.abs(fx - tx) < 1 && Math.abs(fy - ty) < 1) camTarget = null;
  }
  for (let i = 0; i < cur.length; i++) {
    pos[i].x = sx(cur[i].x) + Math.sin(el * .6 + i) * 1.4 * k;
    pos[i].y = sy(cur[i].y) + Math.cos(el * .45 + i * .7) * 1.1 * k;
  }
  draw(el);
  papers.forEach(function (m) {
    m.el.style.left = sx(m.ux) + 'px'; m.el.style.top = sy(m.uy) + 'px';
    m.el.style.width = m.w + 'px'; m.el.style.height = m.h + 'px';
  });
  zoomhud.textContent = 'ZOOM ' + k.toFixed(2) + '×';
  requestAnimationFrame(frame);
}

function draw(el) {
  ctx.fillStyle = '#0e1014'; ctx.fillRect(0, 0, W, H);
  const g = 40 * k;
  ctx.strokeStyle = 'rgba(255,255,255,.035)'; ctx.lineWidth = 1;
  for (let x = tx % g; x < W; x += g) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = ty % g; y < H; y += g) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  if (mode === 'radial' && mt > .55) {
    ctx.globalAlpha = (mt - .55) / .45;
    ctx.font = '10px system-ui';
    RANKS.forEach(function (rk) {
      const r = ringR(rk), cxp = sx(.5), cyp = sy(.5 - r * 1.55);
      const name = RANKNAME[rk] || ('L' + rk);
      ctx.strokeStyle = 'rgba(255,255,255,.055)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(cxp, sy(.5), (sx(.5 + r * .95) - cxp), (sy(.5) - cyp), 0, 0, 6.2832);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.30)';
      ctx.fillText(name, cxp - ctx.measureText(name).width / 2, cyp - 7);
    });
    ctx.globalAlpha = 1;
  }
  const focus = hot || focusNode;
  const out = new Set(), into = new Set();
  if (focus) {
    edges.forEach(function (e) {
      if (e.s === focus) out.add(e.t.i);
      if (e.t === focus) into.add(e.s.i);
    });
  }
  edges.forEach(function (e) {
    const a = pos[e.s.i], b = pos[e.t.i];
    const lit = focus && (e.s === focus || e.t === focus);
    ctx.strokeStyle = lit ? (e.s === focus ? 'rgba(255,214,110,.88)' : 'rgba(110,215,255,.78)')
                          : (focus ? 'rgba(160,180,220,.045)' : 'rgba(160,180,220,.10)');
    ctx.lineWidth = lit ? 1.5 : .6;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    ctx.beginPath(); ctx.moveTo(a.x, a.y);
    ctx.quadraticCurveTo(mx + (b.y - a.y) * .10, my - (b.x - a.x) * .10, b.x, b.y);
    ctx.stroke();
  });
  papers.forEach(function (m) {
    const a = pos[m.n.i];
    ctx.strokeStyle = 'rgba(247,245,239,.42)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(sx(m.ux) + 10, sy(m.uy) + 10); ctx.stroke();
  });
  nodes.forEach(function (n, i) {
    const p = pos[i], r = radius(n) * Math.min(k, 2.2), lit = focus === n;
    const near = out.has(i) || into.has(i);
    ctx.globalAlpha = focus && !lit && !near ? .40 : 1;
    if (paperOf(n) || n === focusNode) {
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 7 + Math.sin(el * 3) * 1.6, 0, 6.2832);
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1; ctx.stroke();
    }
    const rr = r + (lit ? 2 : 0);
    ctx.fillStyle = pinOf(n.layer).c;
    if (pinOf(n.layer).d) {
      const d = rr * 1.35;
      ctx.beginPath(); ctx.moveTo(p.x, p.y - d); ctx.lineTo(p.x + d, p.y);
      ctx.lineTo(p.x, p.y + d); ctx.lineTo(p.x - d, p.y); ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
    n.labelAt = rr;
  });
  nodes.forEach(function (n, i) {
    const p = pos[i], lit = focus === n;
    const near = out.has(i) || into.has(i);
    if (!lit && !near && !(n.indeg >= 12 || k > 1.6)) return;
    if (focus && !lit && !near) ctx.globalAlpha = .40;
    /* gold is what the focus points at, blue is what points at it: the colours the edges carry */
    ctx.fillStyle = lit ? '#fff'
                  : out.has(i) ? 'rgba(255,214,110,.95)'
                  : into.has(i) ? 'rgba(150,225,255,.95)'
                  : 'rgba(232,234,240,.58)';
    ctx.font = (lit || near ? '600 11px' : '10px') + ' system-ui';
    ctx.fillText(n.name, p.x + n.labelAt + 5, p.y + 3);
    ctx.globalAlpha = 1;
  });
}

/* ===== INPUT — pointer and keys ===== */
function at(ev) {
  const b = cv.getBoundingClientRect(), mx = ev.clientX - b.left, my = ev.clientY - b.top;
  let best = null, bd = 256;
  pos.forEach(function (p, i) {
    const dx = p.x - mx, dy = p.y - my, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = nodes[i]; }
  });
  return best;
}

cv.addEventListener('mousedown', function (ev) {
  const n = at(ev);
  drag = n ? { node: n, moved: 0, mx: ev.clientX, my: ev.clientY }
           : { pan: true, moved: 0, mx: ev.clientX, my: ev.clientY };
  camOn = false; camBtn.classList.remove('on'); camTarget = null;
});

addEventListener('mousemove', function (ev) {
  if (drag) {
    const dx = ev.clientX - drag.mx, dy = ev.clientY - drag.my;
    drag.mx = ev.clientX; drag.my = ev.clientY;
    if (drag.paper) {
      if (drag.mode === 'move') {
        drag.paper.ux += dx / (W * k * SPREAD); drag.paper.uy += dy / (H * k * SPREAD);
      } else {
        drag.paper.w = Math.max(200, drag.paper.w + dx);
        drag.paper.h = Math.max(140, drag.paper.h + dy);
      }
      return;
    }
    drag.moved += Math.abs(dx) + Math.abs(dy);
    if (drag.pan) { tx += dx; ty += dy; }
    else {
      const i = drag.node.i;
      cur[i].x += dx / (W * k * SPREAD); cur[i].y += dy / (H * k * SPREAD);
      to[i].x = cur[i].x; to[i].y = cur[i].y; from[i].x = cur[i].x; from[i].y = cur[i].y;
    }
    return;
  }
  if (ev.target !== cv) return;
  hot = at(ev);
  lbl.innerHTML = hot ? (hot.p + '  ←' + hot.indeg + '  →' + hot.outdeg) : '&nbsp;';
  cv.style.cursor = hot ? 'pointer' : 'grab';
});

addEventListener('mouseup', function () {
  if (drag && drag.paper) drag.paper.el.classList.remove('dragging');
  else if (drag && drag.moved < 4 && drag.node) toggle(drag.node);
  drag = null;
});

cv.addEventListener('wheel', function (ev) {
  ev.preventDefault();
  const b = cv.getBoundingClientRect();
  zoomAbout(k * Math.exp(-ev.deltaY * .0016), ev.clientX - b.left, ev.clientY - b.top);
  camOn = false; camBtn.classList.remove('on'); camTarget = null;
}, { passive: false });

/* ===== BOOT ===== */
addEventListener('resize', resize);

resize();

requestAnimationFrame(frame);
</script>
</body>
</html>
